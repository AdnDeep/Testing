name: Pronóstico lluvias Guayaquil

on:
  # A demanda: botón "Run workflow" en GitHub, `gh workflow run`, o el agente de Claude.
  workflow_dispatch:
  # A demanda por commit: el agente escribe en solicitudes/ y hace push.
  push:
    branches: [main]
    paths: ["solicitudes/**"]
  # Respaldo: 4 veces al día, después de que salen las corridas 00/06/12/18 UTC de GFS.
  schedule:
    - cron: "35 4,10,16,22 * * *"

permissions:
  contents: write

concurrency:
  group: pronostico
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar pronóstico
        run: python -m src.run

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "pronostico-bot"
          git config user.email "pronostico-bot@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Pronóstico $(TZ=America/Guayaquil date '+%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

      - name: Publicar entregable como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: pronostico-guayaquil
          path: output/latest/
          retention-days: 14
