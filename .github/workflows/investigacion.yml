name: Investigación estaciones INAMHI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["investigacion/solicitud.txt"]

permissions:
  contents: write

concurrency:
  group: pronostico
  cancel-in-progress: false

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install requests
      - name: Investigar
        continue-on-error: true
        run: python investigacion/estaciones.py 2>&1 | tee investigacion/resultados_log.txt
      - name: Guardar
        if: always()
        run: |
          git config user.name "pronostico-bot"
          git config user.email "pronostico-bot@users.noreply.github.com"
          git add investigacion
          git diff --cached --quiet && exit 0
          git commit -m "Investigación estaciones INAMHI [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
